_min_copier_version: "9.0.0"
_exclude:
  - ".git"
  - ".git/**"
  - "copier.yml"
  - ".github/workflows/template-smoke.yml"
  - "scripts/smoke_render_template.sh"
  - "tests"
  - "tests/test_runtime_assets.py"
  - "tests/test_template_smoke.py"
  - "tests/test_youtube_runtime.py"
_tasks:
  - python .copier-tasks/post_copy.py .copier-tasks/context.json

api_key:
  type: str
  secret: true
  default: ""
  help: WordLift API key (required)
  validator: "{% if not api_key or not api_key|trim %}api_key is required{% endif %}"

validate_api_key:
  type: bool
  default: true
  help: Validate API key against WordLift API during project generation
  when: "{{ false }}"

source_type:
  type: str
  help: Source of your page list
  choices:
    "Manual URL list": urls
    "Sitemap XML": sitemap
    "Google Sheets": google_sheets

urls:
  type: yaml
  help: Page URLs (YAML list)
  when: "{{ source_type == 'urls' }}"
  validator: "{% if source_type == 'urls' and (not urls or urls|length == 0) %}urls is required when source_type=urls{% endif %}"

sitemap_url:
  type: str
  help: Sitemap URL
  when: "{{ source_type == 'sitemap' }}"
  validator: "{% if source_type == 'sitemap' and (not sitemap_url or not sitemap_url|trim) %}sitemap_url is required when source_type=sitemap{% endif %}"

sitemap_url_pattern:
  type: str
  default: ""
  help: Sitemap URL filter pattern (optional regex)
  when: "{{ source_type == 'sitemap' }}"

sheets_url:
  type: str
  help: Google Sheets document URL
  when: "{{ source_type == 'google_sheets' }}"
  validator: "{% if source_type == 'google_sheets' and (not sheets_url or not sheets_url|trim) %}sheets_url is required when source_type=google_sheets{% endif %}"

sheets_name:
  type: str
  help: Google Sheets tab name
  when: "{{ source_type == 'google_sheets' }}"
  validator: "{% if source_type == 'google_sheets' and (not sheets_name or not sheets_name|trim) %}sheets_name is required when source_type=google_sheets{% endif %}"

sheets_service_account:
  type: str
  secret: true
  default: ""
  help: Google service account (JSON or path)
  when: "{{ source_type == 'google_sheets' }}"
  validator: "{% if source_type == 'google_sheets' and not sheets_service_account %}sheets_service_account is required when source_type=google_sheets{% endif %}"

overwrite:
  type: bool
  default: true
  help: Overwrite existing entities

log_level:
  type: str
  default: warning
  help: Log level
  when: "{{ false }}"

graph_write_strategy:
  type: str
  default: put
  help: Graph write strategy
  when: "{{ false }}"

canonical_id_strategy:
  type: str
  default: dependency_graph
  help: Canonical ID strategy
  when: "{{ false }}"

postprocessor_pool_size:
  type: int
  default: 2
  help: Postprocessor pool size
  when: "{{ false }}"

postprocessor_runtime:
  type: str
  default: persistent
  help: Postprocessor runtime
  when: "{{ false }}"

shacl_pool_size:
  type: int
  default: 1
  help: SHACL pool size
  when: "{{ false }}"

shacl_exclude_builtin_shapes:
  type: yaml
  default:
    - google-course
    - google-recipe
  help: SHACL built-in shapes to exclude
  when: "{{ false }}"

mapping_pool_size:
  type: int
  default: 1
  help: Mapping pool size
  when: "{{ false }}"

playwright_wait_until:
  type: str
  default: domcontentloaded
  help: Playwright wait_until event
  when: "{{ false }}"

playwright_headless:
  type: bool
  default: true
  help: Run Playwright in headless mode
  when: "{{ false }}"

ingest_retry_attempts:
  type: int
  default: 2
  help: Ingest retry attempts
  when: "{{ false }}"

ingest_retry_backoff_ms:
  type: int
  default: 3000
  help: Ingest retry backoff (milliseconds)
  when: "{{ false }}"

concurrency:
  type: int
  default: 4
  help: Parallel import workers
  when: "{{ false }}"

ingest_loader:
  type: str
  default: crawler
  help: Ingestion loader
  choices:
    - web_scrape_api
    - simple
    - proxy
    - playwright
    - premium_scraper
    - passthrough
    - crawler
  when: "{{ false }}"

ingest_timeout_ms:
  type: int
  default: 600000
  help: Per-page timeout override (ms); crawler default 600000 (10 min), other loaders default 30000 (30 s)
  when: "{{ false }}"

crawler_js_render_mode:
  type: str
  default: disabled
  help: Crawler JS render mode (disabled | auto | enabled)
  choices:
    - disabled
    - auto
    - enabled
  when: "{{ false }}"

crawler_proxy_mode:
  type: str
  default: disabled
  help: Crawler proxy mode (disabled | simple | standard | premium | auto)
  choices:
    - disabled
    - simple
    - standard
    - premium
    - auto
  when: "{{ false }}"

google_search_console:
  type: bool
  default: false
  help: Enable Google Search Console enrichment
  when: "{{ false }}"

profiles:
  type: yaml
  default:
    - default
  help: Profiles to generate (YAML list)
  validator: "{% if not profiles or profiles|length == 0 %}profiles must include at least one profile{% endif %}"
  when: "{{ false }}"

default_profile:
  type: str
  default: default
  help: Default profile
  validator: "{% if default_profile not in profiles %}default_profile must be one of the selected profiles{% endif %}"
  when: "{{ false }}"
